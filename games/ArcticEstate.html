function chooseToken(button,token) {

selectedToken = token;

document
.querySelectorAll(".token-choice")
.forEach(b => b.classList.remove("selected"));

button.classList.add("selected");

function startGame() {

let total =
Number(document.getElementById("playerCount").value);

let humans =
Number(document.getElementById("humanCount").value);

if(humans > total) {

humans = total;

document.getElementById("humanCount").value = total;

}

players = [];

for(let i=0;i<total;i++) {

players.push({

name:
i === 0
? "Player 1"
: i < humans
? "Player " + (i+1)
: "Bot " + (i-humans+1),

human:i < humans,

token:
i === 0
? selectedToken
: tokenList[i],

money:startingMoney,

position:0,

properties:[],

loan:0,

loanInterest:0,

bnpl:[],

alive:true,

skipTurn:0,

frozen:false,

bailCard:false

});

}

board = JSON.parse(JSON.stringify(spaces));

chanceDeck = [];

chanceTemplates.forEach((card,index)=>{

let copies =
card.effect === "bail"
? 1
: 4;

for(let i=0;i<copies;i++) {

chanceDeck.push({
...card,
id:Math.random()
});

}

});

chanceDeck =
shuffle(chanceDeck);

currentPlayer = 0;

gameStarted = true;

document.getElementById("menu").style.display="none";

document.getElementById("game").style.display="block";

log("Welcome to Arctic Estate!");

log(
"The Chance deck contains 32 cards, but only one is an Igloo Bail Free card."
);

render();

}


function shuffle(array) {

let a=[...array];

for(let i=a.length-1;i>0;i--) {

let j=Math.floor(Math.random()*(i+1));

[a[i],a[j]]=[a[j],a[i]];

}

return a;

}


function rollDice() {

if(rolled || !gameStarted) return;

let player=players[currentPlayer];

if(!player.alive) {

nextTurn();

return;

}

if(player.skipTurn>0) {

player.skipTurn--;

log(player.name+" loses this turn.");

nextTurn();

return;

}

let d1=Math.floor(Math.random()*6)+1;

let d2=Math.floor(Math.random()*6)+1;

diceTotal=d1+d2;

rolled=true;

document.getElementById("diceDisplay").textContent=
"🎲 "+d1+" + 🎲 "+d2+" = "+diceTotal;

player.position += diceTotal;

if(player.position >= board.length) {

player.position -= board.length;

player.money += 200;

log(player.name+" passed START and collected $200.");

}

log(
player.name+
" moved to "+
board[player.position].name+"."
);

landOnSpace();

}


function landOnSpace() {

let player=players[currentPlayer];

let space=board[player.position];


if(space.type==="property") {

if(space.owner===null) {

if(player.money>=space.price) {

if(player.human) {

showPropertyPurchase(space);

} else {

botBuyProperty(space);

}

} else {

log(
player.name+
" cannot afford "+
space.name+"."
);

finishTurn();

}

}

else if(space.owner!==currentPlayer) {

let owner=players[space.owner];

let rent=space.rent;

if(owner.frozen) {

log(
owner.name+
" cannot collect rent right now."
);

} else {

payPlayer(player,owner,rent);

}

finishTurn();

}

else {

log(player.name+" landed on their own property.");

finishTurn();

}

}


else if(space.type==="chance") {

drawChance();

}


else if(space.type==="tax") {

payBank(player,space.amount);

finishTurn();

}


else if(space.type==="gotojail") {

player.position=5;

log(player.name+" was sent to the Ice Prison!");

finishTurn();

}


else {

finishTurn();

}

}

openModal(

`

<p>Price: $${space.price}</p>

<p>Rent: $${space.rent}</p>

<button onclick="buyProperty(${players[currentPlayer].position})">

</button>

<button onclick="finishTurn()">

</button>

`

);

}


function buyProperty(index) {

let player=players[currentPlayer];

let space=board[index];

if(player.money<space.price) {

closeModal();

return;

}

player.money-=space.price;

space.owner=currentPlayer;

player.properties.push(index);

log(
player.name+
" bought "+
space.name+
" for $"+
space.price+"."
);

closeModal();

finishTurn();

}


function botBuyProperty(space) {

let player=players[currentPlayer];

let shouldBuy =
player.money-space.price >= 300 ||
Math.random()<0.65;

if(shouldBuy) {

player.money-=space.price;

space.owner=currentPlayer;

player.properties.push(player.position);

log(
player.name+
" bought "+
space.name+
"."
);

} else {

log(
player.name+
" passed on "+
space.name+"."
);

}

finishTurn();

}


function payPlayer(from,to,amount) {

if(from.money>=amount) {

from.money-=amount;

to.money+=amount;

log(
from.name+
" paid $"+
amount+
" rent to "+
to.name+"."
);

} else {

let remaining=amount-from.money;

to.money+=from.money;

from.money=0;

log(
from.name+
" could not fully pay rent."
);

handleDebt(from,remaining);

}

}


function payBank(player,amount) {

if(player.money>=amount) {

player.money-=amount;

log(
player.name+
" paid $"+
amount+
" to the bank."
);

} else {

let debt=amount-player.money;

player.money=0;

handleDebt(player,debt);

}

}


function handleDebt(player,debt) {

if(player.loan+player.money>=debt) {

player.loan+=debt;

player.loanInterest+=
Math.ceil(debt*0.1);

log(
player.name+
" took on $"+
debt+
" in emergency debt."
);

} else {

bankrupt(player);

}

}


function bankrupt(player) {

player.alive=false;

for(let property of player.properties) {

board[property].owner=null;

}

player.properties=[];

log(
"💸 "+
player.name+
" went bankrupt!"
);

checkWinner();

}


function drawChance() {

if(chanceDeck.length===0) {

log("The Chance deck is empty.");

finishTurn();

return;

}

chanceOptions=[];

let temp=[...chanceDeck];

for(let i=0;i<8 && temp.length>0;i++) {

let index=
Math.floor(Math.random()*temp.length);

chanceOptions.push(temp.splice(index,1)[0]);

}

showChanceOptions();

}


function showChanceOptions() {

let html="";

chanceOptions.forEach((card,index)=>{

html+=`

<div class="chance-card"
onclick="chooseChance(${index})">

<div class="chance-icon">
${card.icon}
</div>

<strong>${card.name}</strong>

<p>${card.description}</p>

</div>

`;

});

openModal(

"Choose One Chance Card",

`

<p>
Pick one card from the eight available options.
</p>

<div class="card-grid">
${html}
</div>

`

);

}


function chooseChance(index) {

let chosen=chanceOptions[index];

let deckIndex=
chanceDeck.findIndex(c=>c.id===chosen.id);

if(deckIndex!==-1) {

chanceDeck.splice(deckIndex,1);

}

let player=players[currentPlayer];

closeModal();

log(
player.name+
" selected "+chosen.name+"."
);

applyChance(chosen);

}


function applyChance(card) {

let player=players[currentPlayer];

if(card.effect==="pay") {

payBank(player,card.amount);

finishTurn();

}


else if(card.effect==="percent") {

let amount=
Math.ceil(player.money*0.1);

payBank(player,amount);

finishTurn();

}


else if(card.effect==="skip") {

player.skipTurn=1;

log(
player.name+
" will lose their next turn."
);

finishTurn();

}


else if(card.effect==="back") {

player.position-=3;

if(player.position<0)
player.position+=board.length;

log(
player.name+
" moved backward three spaces."
);

finishTurn();

}


else if(card.effect==="freeze") {

player.frozen=true;

log(
player.name+
" cannot collect rent until their next turn."
);

finishTurn();

}


else if(card.effect==="bail") {

player.bailCard=true;

log(
player.name+
" received the RARE Igloo Bail Free card!"
);

finishTurn();

}

}

function takeLoan() {

let player=players[currentPlayer];

function repayLoan() {

let player=players[currentPlayer];

if(player.loan<=0) {

return;

}

if(player.money<500) {

log("Not enough money to repay $500.");

return;

}

player.money-=500;

player.loan-=500;

player.loanInterest=
Math.max(
0,
player.loanInterest-100
);

log(
player.name+
" repaid $500 of their loan."
);

closeModal();

render();

}

if(!player.human) return;

let available=
board.filter(
s =>
s.type==="property" &&
s.owner===null &&
s.price>=250
);

let html="";

available.forEach(space=>{

let index=board.indexOf(space);

html+=`

<div class="loan-box">

<strong>${space.name}</strong>

<p>
Price: $${space.price}
</p>

<p>
Down payment: $${Math.ceil(space.price*0.25)}
</p>

<p>
Remaining balance: $${Math.ceil(space.price*0.75)}
</p>

<button onclick="buyBNPL(${index})">
BUY NOW, PAY LATER
</button>

</div>

`;

});

if(html==="") {

html="<p>No properties currently available for BNPL.</p>";

}

openModal(

"💳 Buy Now, Pay Later",

html

);

}


function buyBNPL(index) {

let player=players[currentPlayer];

let space=board[index];

let down=
Math.ceil(space.price*0.25);

if(player.money<down) {

log("You cannot afford the down payment.");

return;

}

player.money-=down;

space.owner=currentPlayer;

player.properties.push(index);

player.bnpl.push({

property:index,

remaining:
Math.ceil(space.price*0.75),

payments:3

});

log(

player.name+
" bought "+
space.name+
" using Buy Now, Pay Later."

);

closeModal();

render();

}


function processBNPL(player) {

if(player.bnpl.length===0)
return;

for(let i=player.bnpl.length-1;i>=0;i--) {

let plan=player.bnpl[i];

let payment=
Math.ceil(
plan.remaining/plan.payments
);

if(player.money>=payment) {

player.money-=payment;

plan.remaining-=payment;

plan.payments--;

log(
player.name+
" made a BNPL payment of $"+
payment+"."
);

if(plan.remaining<=0) {

player.bnpl.splice(i,1);

log(
player.name+
" fully paid off a property!"
);

}

} else {

log(
player.name+
" missed a BNPL payment."
);

player.loan+=payment;

player.loanInterest+=
Math.ceil(payment*0.1);

}

}

}


function finishTurn() {

if(!gameStarted)
return;

let player=players[currentPlayer];

if(player.frozen) {

player.frozen=false;

}

processBNPL(player);

if(player.loan>0) {

let interest=
Math.ceil(player.loan*0.05);

player.loanInterest+=interest;

if(player.money>=interest) {

player.money-=interest;

log(
player.name+
" paid $"+
interest+
" in loan interest."
);

}

}

checkWinner();

if(!gameStarted)
return;

rolled=false;

currentPlayer=
findNextPlayer(currentPlayer);

render();

if(!players[currentPlayer].human) {

setTimeout(botTurn,800);

}

}


function findNextPlayer(index) {

let next=index;

do {

next++;

if(next>=players.length)
next=0;

} while(!players[next].alive);

return next;

}


function botTurn() {

let bot=players[currentPlayer];

if(!bot || bot.human || !bot.alive)
return;

if(bot.skipTurn>0) {

bot.skipTurn--;

log(
bot.name+
" loses their turn."
);

finishTurn();

return;

}

setTimeout(()=>{

let d1=
Math.floor(Math.random()*6)+1;

let d2=
Math.floor(Math.random()*6)+1;

diceTotal=d1+d2;

rolled=true;

bot.position+=diceTotal;

if(bot.position>=board.length) {

bot.position-=board.length;

bot.money+=200;

}

log(
bot.name+
" rolled "+
diceTotal+
"."
);

landOnSpace();

},600);

}


function checkWinner() {

let alive=
players.filter(p=>p.alive);

if(alive.length<=1) {

gameStarted=false;

let winner=alive[0];

openModal(

"🏆 GAME OVER",

`

<h1>${winner.token}</h1>

<h2>${winner.name} wins Arctic Estate!</h2>

<p>
The last penguin standing has conquered the Arctic.
</p>

<button onclick="location.reload()">
PLAY AGAIN
</button>

`

);

}

}


function render() {

renderPlayers();

renderProperties();

renderBoard();

renderLoanInfo();

document.getElementById("turnText").textContent=
players[currentPlayer].name+
"'s Turn "+
players[currentPlayer].token;

document.getElementById("rollButton").disabled=
!players[currentPlayer].human ||
rolled;

}


function renderPlayers() {

let container=
document.getElementById("players");

container.innerHTML="";

players.forEach((player,index)=>{

let div=
document.createElement("div");

div.className="player-box";

if(index===currentPlayer)
div.classList.add("active");

if(!player.alive)
div.classList.add("bankrupt");

div.innerHTML=`

<strong>
${player.token}
${player.name}
</strong>

<br>

<span class="player-money">
$${player.money}
</span>

<br>

Properties:
${player.properties.length}

`;

container.appendChild(div);

});

}


function renderProperties() {

let container=
document.getElementById("properties");

container.innerHTML="";

let player=players[currentPlayer];

player.properties.forEach(index=>{

let space=board[index];

let div=
document.createElement("div");

div.className="property-item";

div.innerHTML=

"<strong>"+
space.name+
"</strong><br>"+
"Rent: $"+
space.rent;

container.appendChild(div);

});

}


function renderLoanInfo() {

let container=
document.getElementById("loanInfo");

container.innerHTML="";

players.forEach(player=>{

if(player.loan>0) {

container.innerHTML+=`

<div class="property-item">

${player.name}

<br>

Debt:
$${player.loan}

<br>

Interest:
$${player.loanInterest}

</div>

`;

}

});

}


function renderBoard() {

let boardElement=
document.getElementById("board");

boardElement.innerHTML="";

let positions=[];

for(let i=0;i<24;i++) {

let row=0;
let col=0;

if(i<=8) {

row=8;
col=i;

}

else if(i<=14) {

col=8;
row=8-(i-8);

}

else if(i<=20) {

row=0;
col=8-(i-14);

}

else {

col=0;
row=i-20;

}

positions.push({row,col});

}

for(let i=0;i<24;i++) {

let space=board[i];

let div=
document.createElement("div");

div.className="space";

let pos=positions[i];

div.style.gridRow=
(pos.row+1);

div.style.gridColumn=
(pos.col+1);

if(space.type==="property") {

div.innerHTML=

`

<div class="property-color"
style="background:${space.color}">
</div>

<div class="space-name">
${space.name}
</div>

<div class="space-price">
$${space.price}
</div>

`;

} else {

div.innerHTML=

`

<div class="space-name">
${space.name}
</div>

`;

}

let tokenHTML="";

players.forEach(player=>{

if(player.alive &&
player.position===i) {

tokenHTML+=player.token;

}

});

if(tokenHTML) {

div.innerHTML+=
`<div class="tokens">${tokenHTML}</div>`;

}

if(space.owner!==null) {

div.style.outline=
"3px solid white";

}

boardElement.appendChild(div);

}

let center=
document.createElement("div");

center.className=
"space center-space";

center.innerHTML=

`

<div>

<h1>🐧</h1>

<h2>ARCTIC<br>ESTATE</h2>

<p>
The frozen world of property capitalism.
</p>

</div>

`;

boardElement.appendChild(center);

}


function log(message) {

let box=
document.getElementById("log");

let entry=
document.createElement("div");

entry.className=
"log-entry";

entry.textContent=
message;

box.prepend(entry);

}


function openModal(title,content) {

document.getElementById("modalTitle")
.textContent=title;

document.getElementById("modalContent")
.innerHTML=content;

document.getElementById("modal")
.style.display="flex";

}


function closeModal() {

document.getElementById("modal")
.style.display="none";

}


</script>

</body>
</html>
